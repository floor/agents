# Review & gate mode config (src/gate.ts / GATE_CONFIG_PATH).
#
# Bare repo names — the owner comes from the GitHub adapter (GITHUB_OWNER),
# same convention as the task-pipeline mode's project.repo.
repos:
  - your-repo

# How often to poll each repo's open PRs, in milliseconds.
pollIntervalMs: 60000

# Template file for the review prompt handed to the configured Reviewer.
# Placeholders: {{repo}} {{prNumber}} {{title}} {{body}} {{baseRef}}
# {{headRef}} {{headSha}} {{changedFiles}} {{checklists}} {{mergeBase}}
promptTemplatePath: config/gate/review-prompt.md

# Where per-PR gate state is persisted (last decision, merged flag).
stateDir: ./data/gate

# Merging is a separate opt-in from this file — see GATE_MERGE_ENABLED in
# .env.example. Dry run (unset / false) is the default and safe to leave on.
mergeEnabled: false

# GitHub logins (case-insensitive) whose own PRs this loop skips entirely —
# put the identity your GITHUB_TOKEN posts as here so this process never
# reviews or merges its own PRs.
excludeAuthors:
  - your-bot-account

gate:
  # Labels that put a PR on the stronger two-vendor + runtime-sign-in-check
  # gate — reserve this for auth/session/token-handling changes in your repo.
  authLabels:
    - auth
  # Label that unconditionally holds a PR for a human, regardless of
  # reviews or checks. Set this to whatever your repo already uses for
  # "needs a human to look at this."
  needsHumanLabel: needs-human
  # SECURITY: a verdict comment only counts if its GitHub comment AUTHOR
  # (not the vendor name its own header claims) is a key here. Without an
  # entry, anyone who can comment on the PR — including the PR's own
  # author — could post "## Reviewer agent (Codex)" / "Verdict: approve
  # as-is" and satisfy the gate. Map each trusted login (case-insensitive)
  # to the vendor it's trusted for. Include your own posting identity
  # (same as excludeAuthors above, if this account also posts reviews)
  # mapped to GATE_REVIEWER's vendor — without it, no verdict from that
  # account (or anyone else not listed) can ever count, so nothing merges
  # and every PR just sits at `needs_review` after one attempted review.
  # (It will NOT be reviewed again and again: which heads have already
  # been attempted is tracked separately, in persisted per-PR state, not
  # by whether a trusted verdict is currently visible.)
  #
  # A value can also be an ARRAY of vendors, for a single login that
  # legitimately posts reviews under more than one vendor — e.g. this same
  # bot account posting both the primary reviewer's verdict and the
  # `secondReviewer`'s verdict below, both under the one GITHUB_TOKEN this
  # process uses to comment. In that case the vendor is taken from the
  # comment's OWN header text ("## Reviewer agent (Codex)" vs.
  # "## Reviewer agent (Gemini)"), but ONLY when it names one of the
  # vendors listed here — a header naming anything else from this login is
  # rejected outright, not attributed to either vendor. One login cannot
  # be mapped to both vendors via two separate string entries; use one
  # array entry instead:
  #
  #   trustedReviewers:
  #     your-bot-account:
  #       - codex
  #       - gemini
  #
  # This example ships with the single-vendor form, since secondReviewer
  # below is off by default:
  trustedReviewers:
    your-bot-account: codex
  # Vendor name of a SECOND Reviewer to also run on any PR carrying an
  # `authLabels` label, in addition to the primary GATE_REVIEWER — so an
  # auth-labelled PR can collect the two independent-vendor
  # `approve as-is` verdicts the auth gate above requires without a human
  # triggering the second review by hand (see docs/review-gate.md). Uses
  # the same vendor kinds as GATE_REVIEWER ("codex", "gemini", "fake") but
  # is selected here, not by an env var — src/gate.ts builds it from this
  # key's value using the same GATE_CODEX_*/GATE_AGY_* env vars regardless
  # of which "slot" (primary or second) a vendor ends up in. Optional;
  # unset (the default) means only the primary reviewer ever runs
  # automatically. Uncomment to enable, and switch trustedReviewers above
  # to the array form if your second reviewer posts under the SAME
  # GitHub login as your primary reviewer (the common case: one
  # GITHUB_TOKEN posting both):
  # secondReviewer: gemini

vendor:
  # A `vendor:<name>` label on the PR wins over every other rule below.
  labelPrefix: "vendor:"
  # Branch-name prefix -> implementer vendor. Adjust to your own naming.
  branchPrefixes:
    - prefix: cursor/
      vendor: cursor
  # A PR body line starting with this prefix -> implementer vendor. Useful
  # for a tool that stamps its PRs with a session/run identifier trailer.
  bodyMarkers:
    - prefix: "Generated-By:"
      vendor: some-agent

# Optional. Fills the {{checklists}} prompt placeholder with the content
# of file(s) picked by a PR's label or touched paths — see
# packages/orchestrator/src/gate/checklists.ts and docs/review-gate.md.
# `file` is a path INSIDE THE TARGET REPO (the `repos:` entries above),
# fetched at the base branch's CURRENT tip (resolved fresh via
# GitAdapter.compare() at review time, falling back to the PR's own
# recorded PRDetails.baseSha only if compare() resolves to null — e.g. a
# deleted base branch — NEVER on a genuine compare() API failure, which
# instead aborts the whole pass like any other unhandled GitAdapter call
# here), NEVER the PR's own head — a PR editing this file on its own
# branch must not be able to soften the checklist that reviews it. If
# neither resolves, checklists are skipped for that pass rather than
# falling back to the head. A rule matches on `label` OR `pathContains`
# (either alone is enough); a PR can match more than one rule, and every
# matched file is included, each capped at 16KB and the total at 48KB
# (truncated with a visible marker past either cap).
# Missing entirely (or an empty `rules: []`) means every prompt renders
# "no checklist matched" in that slot — same behavior as before this key
# existed. This example mirrors a docs/review/ layout in your-org/your-repo;
# adjust file paths to whatever your target repo actually ships:
# checklists:
#   rules:
#     - label: auth
#       file: docs/review/concurrency.md
#     - pathContains: player/
#       file: docs/review/concurrency.md
#     - pathContains: session
#       file: docs/review/concurrency.md
#     - pathContains: state
#       file: docs/review/concurrency.md
#     - label: parity
#       file: docs/review/matrix.md
#     - pathContains: PARITY.md
#       file: docs/review/matrix.md

# Optional. Selects shell command(s) a worktree-creating Reviewer (today:
# @floor-agents/codex-cli only — a Reviewer that doesn't create a local
# worktree ignores this entirely) runs BEFORE reviewing a PR, so its own
# later commands (bun test, bun run typecheck, ...) have real dependencies
# installed instead of failing on a missing node_modules every review —
# see packages/orchestrator/src/gate/prepare.ts and docs/review-gate.md.
# `pathPrefix` is matched against the PR's changed files the same way
# checklists' `pathContains` is (just anchored to the start); `command`
# runs from `<worktree>/<pathPrefix>`. The command comes from THIS repo's
# own config, never from the PR — no argv-injection concern the way the
# review prompt or codex-cli's model/profile flags have. The literal value
# "none" documents an intentionally-skipped path without a separate
# on/off field. Each selected command is killed and treated as failed
# after `timeoutMs` (default 120000 = 2 minutes); a failure is reported to
# the reviewer as one line prepended to its prompt, never aborts the
# review, and its own output is never captured into anything the prompt
# could include. Runs are cached by the target directory's lockfile
# content hash (bun.lock, bun.lockb, package-lock.json, yarn.lock, or
# pnpm-lock.yaml — whichever is found first), for the life of the
# Reviewer process; a directory with none of those is never cached, so it
# runs fresh every time. Missing entirely (or an empty `rules: []`) means
# no Reviewer ever gets a `prepareSteps` value — same behavior as before
# this key existed. Adjust to your own repo's package managers/directories:
# prepare:
#   timeoutMs: 120000
#   rules:
#     - pathPrefix: web/
#       command: bun install --frozen-lockfile
#     - pathPrefix: android/
#       command: none
#     - pathPrefix: ios/
#       command: none
