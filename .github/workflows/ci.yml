name: CI

on:
  push:
    branches: [staging, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The worktree tests create a throwaway git repo on the `main` branch.
      - name: Configure git
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@floor.io"
          git config --global user.name "Floor CI"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
